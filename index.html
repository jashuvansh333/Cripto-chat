<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Math & Digital Security Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Vadodara:wght@400;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: #151c2c;
            --accent-blue: #0ea5e9;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-light: #f8fafc;
            --border-color: #1e293b;
        }

        * {
            box-sizing: border-box;
            font-family: 'Hind Vadodara', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #070a11 0%, #0f172a 100%);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        .chat-app {
            width: 100%;
            max-width: 480px;
            height: 94vh;
            background: var(--card-bg);
            border-radius: 20px;
            border: 2px solid #38bdf8;
            box-shadow: 0 10px 30px rgba(14, 165, 233, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header Styling */
        .app-header {
            background: linear-gradient(90deg, #0f172a, #1e293b);
            padding: 12px 16px;
            text-align: center;
            border-bottom: 2px solid var(--border-color);
            position: relative;
        }

        .app-header h1 {
            font-family: 'Orbitron', 'Hind Vadodara', sans-serif;
            font-size: 16px;
            color: #38bdf8;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .school-subtitle {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 2px;
            font-weight: 600;
        }

        /* Control Panel / Keys Box */
        .config-panel {
            background: #0f172a;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group {
            display: flex;
            gap: 8px;
        }

        .input-field {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .input-field label {
            font-size: 10px;
            color: #38bdf8;
            font-weight: 700;
            margin-bottom: 2px;
            text-transform: uppercase;
        }

        input[type="text"], input[type="password"] {
            background: #1e293b;
            border: 1px solid #334155;
            color: #fff;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 8px rgba(14, 165, 233, 0.4);
        }

        /* Messages Body */
        .messages-container {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: rgba(11, 15, 25, 0.6);
        }

        .message-card {
            background: #1e293b;
            border-radius: 12px;
            padding: 8px 12px;
            max-width: 85%;
            align-self: flex-start;
            border-left: 3px solid var(--accent-red);
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            position: relative;
            animation: fadeIn 0.3s ease-in-out;
        }

        .message-card.unlocked {
            border-left: 3px solid var(--accent-green);
            background: #0f291e;
        }

        .sender-tag {
            font-size: 10px;
            color: #f59e0b;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2px;
        }

        .status-badge {
            font-size: 9px;
            padding: 1px 6px;
            border-radius: 10px;
            font-weight: 700;
        }

        .badge-locked { background: rgba(239, 68, 68, 0.2); color: #f87171; }
        .badge-unlocked { background: rgba(16, 185, 129, 0.2); color: #34d399; }

        .message-text {
            font-size: 13px;
            color: #f1f5f9;
            word-break: break-all;
            line-height: 1.3;
        }

        /* Footer Input Area */
        .input-area {
            padding: 10px 12px;
            background: #0f172a;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 8px;
        }

        .message-input {
            flex: 1;
            padding: 8px 12px;
            border-radius: 20px;
            background: #1e293b;
            border: 1px solid #334155;
            color: #fff;
            font-size: 13px;
        }

        .send-btn {
            background: linear-gradient(135deg, #0284c7, #0ea5e9);
            color: white;
            border: none;
            padding: 0 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(14, 165, 233, 0.4);
            transition: transform 0.2s;
        }

        .send-btn:active {
            transform: scale(0.95);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

    <!-- CryptoJS Lib -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <!-- Firebase Libs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<div class="chat-app">
    <div class="app-header">
        <h1>🔒 CRYPTO SECURITY CHAT</h1>
        <div class="school-subtitle">શ્રી બોળાસ પ્રાથમિક શાળા - ગણિત વિજ્ઞાન પ્રોજેક્ટ</div>
    </div>

    <div class="config-panel">
        <div class="input-group">
            <div class="input-field">
                <label>તમારું નામ (User Name):</label>
                <input type="text" id="username" placeholder="દા.ત. જશુભાઈ">
            </div>
            <div class="input-field">
                <label>Secret Key (મેસેજ અનલોક પિન):</label>
                <input type="password" id="secretKey" placeholder="દા.ત. 1234" oninput="renderMessages()">
            </div>
        </div>
    </div>

    <div class="messages-container" id="msgBox">
        <div style="text-align: center; color: #64748b; font-size: 12px; margin-top: 20px;">
            કનેક્શન થઈ રહ્યું છે... લાઈવ મેસેજ અહીં દેખાશે.
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="messageInput" class="message-input" placeholder="મેસેજ લખો..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button class="send-btn" onclick="sendMessage()">Send 🚀</button>
    </div>
</div>

<script>
    // ⚠️ Firebase Config Setup
    // ફાયરબેઝ કન્સોલમાંથી મળતી ડિટેલ્સ અહીં ઉમેરો
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
        databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT_ID.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    // Firebase Initialize
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const chatRef = database.ref("crypto_messages");

    let rawMessages = [];

    // Realtime Database listener
    chatRef.on('value', (snapshot) => {
        const data = snapshot.val();
        rawMessages = [];
        if (data) {
            Object.keys(data).forEach(key => {
                rawMessages.push(data[key]);
            });
        }
        renderMessages();
    });

    function sendMessage() {
        const user = document.getElementById('username').value.trim();
        const key = document.getElementById('secretKey').value.trim();
        const msg = document.getElementById('messageInput').value.trim();

        if (!user || !key || !msg) {
            alert('કૃપા કરીને નામ, Secret Key અને મેસેજ લખો!');
            return;
        }

        // AES Encryption
        const encryptedMsg = CryptoJS.AES.encrypt(msg, key).toString();

        chatRef.push({
            sender: user,
            text: encryptedMsg,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        });

        document.getElementById('messageInput').value = '';
    }

    function renderMessages() {
        const key = document.getElementById('secretKey').value.trim();
        const box = document.getElementById('msgBox');
        box.innerHTML = '';

        if (rawMessages.length === 0) {
            box.innerHTML = '<div style="text-align: center; color: #64748b; font-size: 12px; margin-top: 20px;">હજી સુધી કોઈ મેસેજ નથી આવ્યા...</div>';
            return;
        }

        rawMessages.forEach(item => {
            let displayText = item.text;
            let isUnlocked = false;

            if (key) {
                try {
                    const bytes = CryptoJS.AES.decrypt(item.text, key);
                    const decrypted = bytes.toString(CryptoJS.enc.Utf8);
                    if (decrypted) {
                        displayText = decrypted;
                        isUnlocked = true;
                    }
                } catch (e) {
                    // Lock status remains false
                }
            }

            const card = document.createElement('div');
            card.className = `message-card ${isUnlocked ? 'unlocked' : ''}`;
            card.innerHTML = `
                <div class="sender-tag">
                    <span>${item.sender} <small style="color:#64748b; font-weight:normal;">(${item.time || ''})</small></span>
                    <span class="status-badge ${isUnlocked ? 'badge-unlocked' : 'badge-locked'}">
                        ${isUnlocked ? 'UNLOCKED 🔓' : 'LOCKED 🔒'}
                    </span>
                </div>
                <div class="message-text">${displayText}</div>
            `;
            box.appendChild(card);
        });

        box.scrollTop = box.scrollHeight;
    }
</script>

</body>
</html>
